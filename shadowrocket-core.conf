# Cloud-managed base. Keep manual settings in a local extended profile.
# Same iOS classification snapshot as Surge; not a node subscription.
# release a4057a9c9857ead42736; ACL4SSR e2f257307bf0ee31921ac948036e942a29a35b35
[General]
update-url = https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/shadowrocket-core.conf
dns-server = 223.5.5.5,119.29.29.29
fallback-dns-server = 223.5.5.5,119.29.29.29
dns-direct-system = false
dns-direct-fallback-proxy = false
use-local-host-item-for-proxy = false
always-ip-address = false
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true
ipv6 = false
prefer-ipv6 = false
private-ip-answer = true
hijack-dns = *:53

