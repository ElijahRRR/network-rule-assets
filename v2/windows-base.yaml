# GitHub rules/DNS only; add the private local script before use.
{
  "mode": "rule",
  "log-level": "warning",
  "profile": {
    "store-selected": true
  },
  "proxies": [
    {
      "name": "断开",
      "type": "reject"
    }
  ],
  "proxy-groups": [
    {
      "name": "日常出口",
      "type": "select",
      "proxies": [
        "断开",
        "自动备用"
      ],
      "use": [
        "DMIT",
        "OCI",
        "机场"
      ],
      "url": "https://cp.cloudflare.com/generate_204"
    },
    {
      "name": "自动备用",
      "type": "fallback",
      "proxies": [
        "断开"
      ],
      "use": [
        "DMIT",
        "OCI",
        "机场"
      ],
      "filter": "原生|美国",
      "url": "https://cp.cloudflare.com/generate_204",
      "interval": 600,
      "hidden": true
    },
    {
      "name": "资源更新",
      "type": "fallback",
      "proxies": [
        "断开"
      ],
      "use": [
        "DMIT",
        "OCI",
        "机场"
      ],
      "filter": "原生|美国",
      "url": "https://cp.cloudflare.com/generate_204",
      "interval": 600,
      "hidden": true
    }
  ],
