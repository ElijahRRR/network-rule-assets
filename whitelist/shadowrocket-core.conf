# 直连白名单基础配置；本地例外放扩展配置中，更新本文件不会改扩展。
# 直连用国内 DNS，普通代理请求交给远端解析；未知域名不触发 GEOIP 查询。
[General]
update-url = https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/shadowrocket-whitelist.conf
dns-server = 223.5.5.5,119.29.29.29
fallback-dns-server = 223.5.5.5,119.29.29.29
dns-direct-system = false
dns-direct-fallback-proxy = false
use-local-host-item-for-proxy = false
always-ip-address = false
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true
ipv6 = false
prefer-ipv6 = false
private-ip-answer = true
hijack-dns = *:53
[Rule]
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/personal-0-direct.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/personal-0-proxy.list,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/public-1-proxy.list,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/public-2-direct.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/public-3-reject.list,REJECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/public-4-direct.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/public-5-proxy.list,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/public-6-direct.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/whitelist/rules/c4521107258c9fb72e01/ios/public-7-direct.list,DIRECT,no-resolve
