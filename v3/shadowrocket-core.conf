# V3 cloud-managed base. Keep manual settings in a local extended profile.
# release 2dedbe961dc4df81689c; ACL4SSR a77a123f5df30a7503605c24a78d63a5be35eae3
[General]
update-url = https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/shadowrocket-core.conf
dns-server = 223.5.5.5,119.29.29.29
fallback-dns-server = 223.5.5.5,119.29.29.29
dns-direct-system = false
dns-direct-fallback-proxy = false
use-local-host-item-for-proxy = false
always-ip-address = false
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true
ipv6 = false
prefer-ipv6 = false
private-ip-answer = true
hijack-dns = *:53

[Rule]
# Local exceptions belong in an EXTENDED profile, before this base.
# Only the final GEOIP rule resolves locally, with domestic DNS.
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/rules/2dedbe961dc4df81689c/ios/personal-0-direct.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/rules/2dedbe961dc4df81689c/ios/personal-0-proxy.list,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/rules/2dedbe961dc4df81689c/ios/public-1-proxy.list,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/rules/2dedbe961dc4df81689c/ios/public-2-direct.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/rules/2dedbe961dc4df81689c/ios/public-3-reject.list,REJECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/rules/2dedbe961dc4df81689c/ios/public-4-direct.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/rules/2dedbe961dc4df81689c/ios/public-5-proxy.list,PROXY,no-resolve
RULE-SET,https://raw.githubusercontent.com/ElijahRRR/network-rule-assets/main/v3/rules/2dedbe961dc4df81689c/ios/public-6-direct.list,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,PROXY

[Host]
localhost = 127.0.0.1
